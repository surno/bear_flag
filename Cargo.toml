[package]
name = "bear_flag"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "=0.7.5", features = ["json"] }
image = "=0.25.2"
usvg = "=0.45.0"
resvg = { version = "=0.45.0" }
thiserror = "=1.0.69"
serde = { version = "=1.0.210", features = ["derive"] }
tokio = { version = "=1.40.0", features = ["macros", "rt-multi-thread", "signal"] }
